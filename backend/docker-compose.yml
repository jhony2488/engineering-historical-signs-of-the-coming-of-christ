services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: sinais
      POSTGRES_PASSWORD: sinais
      POSTGRES_DB: sinais
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/20260604000001_init_schema.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./migrations/20260604000002_match_documents_hmm_seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./migrations/20260605000001_baseline_escatologico.sql:/docker-entrypoint-initdb.d/03-baseline.sql:ro
      - ./migrations/20260605100001_baseline_atualizacoes.sql:/docker-entrypoint-initdb.d/04-baseline-updates.sql:ro
      - ./migrations/20260605120001_newsletter_subscribers.sql:/docker-entrypoint-initdb.d/05-newsletter.sql:ro
      - ./migrations/20260805000001_layers_10_15.sql:/docker-entrypoint-initdb.d/06-layers.sql:ro
      - ./migrations/20260806000001_joshua_project.sql:/docker-entrypoint-initdb.d/07-joshua.sql:ro
      - ./migrations/20261002000001_propostas_ajuste.sql:/docker-entrypoint-initdb.d/08-propostas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sinais -d sinais"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LLM_DRY_RUN: "true"
      ADMIN_API_KEY: change-me
      API_RATE_LIMIT: 120/minute
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://sinais:sinais@postgres:5432/sinais
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Batch diário em dry-run (sem chaves LLM)
  # Uso: docker compose --profile batch run --rm batch
  batch:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    profiles: [batch]
    environment:
      LLM_DRY_RUN: "true"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://sinais:sinais@postgres:5432/sinais
      ADMIN_API_KEY: change-me
    command: python -m motor.cli run-daily --dry-run --force
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
