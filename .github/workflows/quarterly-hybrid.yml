name: Quarterly Hybrid — Motor Nível 3

on:
  schedule:
    # Jan/Abr/Jul/Out dia 1, 10:45 UTC — após síntese trimestral (10:00)
    - cron: "45 10 1 1,4,7,10 *"
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  hybrid:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run quarterly hybrid analysis (Nível 3)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_DRY_RUN: ${{ vars.EMAIL_DRY_RUN || 'true' }}
          LLM_DRY_RUN: ${{ vars.LLM_DRY_RUN || 'false' }}
          LOCAL_LLM_ENABLED: ${{ vars.LOCAL_LLM_ENABLED || 'false' }}
          PROMPTS_LANG: ${{ vars.PROMPTS_LANG || 'en' }}
          TRANSLATE_NARRATIVES: ${{ vars.TRANSLATE_NARRATIVES || 'true' }}
          CLASSIFIER_HINTS_ENABLED: ${{ vars.CLASSIFIER_HINTS_ENABLED || 'true' }}
        run: python -m motor.cli run-hybrid-analysis --window quarterly
